name: source probe

# Manual only. Checks from a runner whether the source answers: reads the
# index, downloads the newest file it names, checks its size and md5,
# reduces it, and prints the row counts, the country codes with no ISO
# equal and three reduced rows. Stores nothing.
# Set the repository secret SOURCE_BASE (the source's base URL)
# (Settings → Secrets and variables → Actions → Secrets); it is masked in every log.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: refuse without the source secret
        env:
          SOURCE_BASE: ${{ secrets.SOURCE_BASE }}
        run: |
          if [ -z "$SOURCE_BASE" ]; then echo "::error::repository secret SOURCE_BASE is not set"; exit 1; fi
      - name: probe
        env:
          SOURCE_BASE: ${{ secrets.SOURCE_BASE }}
        run: |
          chmod +x bin/source-probe
          sha256sum bin/source-probe
          bin/source-probe
